---

- name: Converge
  hosts: grp_targets
  module_defaults:
    ansible.builtin.setup:
      gather_subset: ['distribution']
  gather_facts: true
  vars:
    no_prompts: true
    auto_restart: true
    openvpn:
      instances:
        test1:
          ips: '192.168.16.2'
          network: '10.1.2.0/28'
          auth:
            providers: ['certificate', 'system']
          port: 1194
          dns: 'ovpn.test.oxl.at'

          pki:
            country: 'AT'
            email: 'ovpn@test.oxl.at'
            org: 'AnsibleGuy Test'
            ou: 'TEST'
            province: 'TestProvince'
            city: 'Graz'

  roles:
    - oxlorg.openvpn
